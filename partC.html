
<!DOCTYPE html>
<html>
<head>
    <title>Lab Exercise 2.1</title>
</head>
<body>

    <h1>Chapter 2 Lab Exercise 2.1 HTML Elements with Attributes</h1>

    <!-- Attribute 1: id -->
    <p id="intro">This paragraph has a unique ID.</p>

    <!-- Attribute 2: class -->
    <p class="highlight">This is the first highlighted paragraph.</p>
    <p class="highlight">This is the second highlighted paragraph.</p>

    <!-- Attribute 3: href -->
    <a href="https://www.google.com">Visit Google</a>

    <br><br>

    <!-- Attribute 4: src -->
    <img src="images/profile.jpg" width="200">

    <!-- Attribute 5: alt -->
    <img src="images/profile.jpg"
         alt="Profile picture"
         width="200">

    <br><br>

    <!-- Attribute 6: title -->
    <p title="This is extra information">
        Move your mouse over this paragraph.
    </p>

    <!-- Attribute 7: style -->
    <p style="color: blue; font-size: 20px;">
        This text is blue and larger.
    </p>

    <!-- Attribute 8: disabled -->
    <input type="text" disabled>

    <br><br>

    <!-- Attribute 9: value -->
    <input type="text" value="HTML Student">

    <br><br>

    <!-- Attribute 10: checked -->
    <input type="checkbox" checked>
    I agree

</body>
</html>
